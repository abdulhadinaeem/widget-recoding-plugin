name: widget_recorder_example
description: "Demonstrates how to use the widget_recorder plugin."

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter

  widget_recorder_plus:
    path: ../

  cupertino_icons: ^1.0.8
  open_file: ^3.5.0
  camera: ^0.10.5+5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

